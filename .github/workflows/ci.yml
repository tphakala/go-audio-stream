name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test (race)
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: |
            go.sum
            cmd/stream-doctor/go.sum
      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$files"
            exit 1
          fi
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
      - name: golangci-lint (stream-doctor)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: cmd/stream-doctor

  doctor:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: cmd/stream-doctor/go.sum
      - name: Build stream-doctor
        working-directory: cmd/stream-doctor
        run: go build ./...
      - name: Vet stream-doctor
        working-directory: cmd/stream-doctor
        run: go vet ./...
      - name: Test stream-doctor (race)
        working-directory: cmd/stream-doctor
        run: go test -race ./...
