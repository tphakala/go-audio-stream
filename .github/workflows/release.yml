name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build, sign, and notarize stream-doctor binaries and create a draft release
    # macOS runner so the darwin binaries can be codesigned and notarized with
    # Apple's tools; Go cross-compiles the linux and windows targets from here.
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history so auto-generated notes can diff against the prior tag.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'

      - name: Build stream-doctor binaries
        working-directory: cmd/stream-doctor
        env:
          # Pure-Go build: go-aac, go-opus, go-wav and simd carry no cgo, so a
          # static cross-compile needs no C toolchain.
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          # GITHUB_REF_NAME is the tag, e.g. "v0.2.0". The artifact filename keeps
          # the "v"; the injected Version drops it so --version and the UserAgent
          # read "stream-doctor/0.2.0", matching the pre-release convention.
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          ldpath="github.com/tphakala/go-audio-stream/cmd/stream-doctor/internal/doctor.Version"
          outdir="${GITHUB_WORKSPACE}/dist"
          mkdir -p "${outdir}"
          # armv7 (GOARM=7) covers 32-bit Raspberry Pi (2/3/Zero 2); arm64 covers
          # Pi 4/5/CM4. darwin has both Intel (amd64) and Apple Silicon (arm64).
          for target in linux/amd64 linux/arm64 linux/arm windows/amd64 darwin/amd64 darwin/arm64; do
            goos="${target%/*}"; goarch="${target#*/}"
            ext=""; [ "${goos}" = "windows" ] && ext=".exe"
            goarm=""; [ "${goarch}" = "arm" ] && goarm="7"
            bin="stream-doctor-${tag}-${goos}-${goarch}${ext}"
            echo "building ${bin}"
            GOOS="${goos}" GOARCH="${goarch}" GOARM="${goarm}" go build -trimpath \
              -ldflags "-s -w -X ${ldpath}=${version}" -o "${outdir}/${bin}" .
          done
          ls -l "${outdir}"

      - name: Check for Apple signing secrets
        id: signing
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${APPLE_CERTIFICATE_BASE64:-}" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::Apple signing secrets are not configured; the macOS binaries will be unsigned and unnotarized."
          fi

      - name: Import code signing certificate
        if: steps.signing.outputs.enabled == 'true'
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Sign and notarize the macOS binaries
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          outdir="${GITHUB_WORKSPACE}/dist"
          # apple-actions/import-codesign-certs creates signing_temp.keychain. Do
          # the matching in awk (which exits 0 even with no match) rather than
          # grep, so an absent certificate does not abort under pipefail before
          # the explicit check below prints a clear error.
          identity=$(security find-identity -v -p codesigning signing_temp.keychain \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          if [ -z "${identity}" ]; then
            echo "no Developer ID Application certificate found in the keychain" >&2
            exit 1
          fi
          echo "signing identity: ${identity}"
          # Codesign each darwin binary with the hardened runtime and a secure
          # timestamp. A static Go binary needs no entitlements.
          for bin in "${outdir}"/stream-doctor-*-darwin-*; do
            echo "signing ${bin}"
            codesign --sign "${identity}" --timestamp --options runtime --verbose "${bin}"
            codesign --verify --strict --verbose=2 "${bin}"
          done
          # Notarize both darwin binaries in one submission. A bare executable
          # cannot be stapled (stapler supports only bundles, dmg, and pkg), so the
          # notarization ticket is served online: Gatekeeper verifies it on first
          # run when the machine is online.
          ( cd "${outdir}" && zip -X "${GITHUB_WORKSPACE}/notarize.zip" stream-doctor-*-darwin-* )
          xcrun notarytool submit "${GITHUB_WORKSPACE}/notarize.zip" \
            --apple-id "${APPLE_ID}" \
            --password "${APPLE_APP_SPECIFIC_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" \
            --wait \
            --timeout 30m
          rm -f "${GITHUB_WORKSPACE}/notarize.zip"

      - name: Compute checksums
        # After signing, since codesign rewrites the darwin binaries in place and
        # changes their hashes. macOS ships shasum, not sha256sum; its output
        # format is identical, so `sha256sum -c checksums.txt` verifies it.
        run: |
          set -euo pipefail
          ( cd "${GITHUB_WORKSPACE}/dist" && shasum -a 256 stream-doctor-* > checksums.txt )
          cat "${GITHUB_WORKSPACE}/dist/checksums.txt"

      - name: Compose release notes preamble
        working-directory: cmd/stream-doctor
        run: |
          set -euo pipefail
          aac=$(go list -m -f '{{.Version}}' github.com/tphakala/go-aac)
          opus=$(go list -m -f '{{.Version}}' github.com/tphakala/go-opus)
          wav=$(go list -m -f '{{.Version}}' github.com/tphakala/go-wav)
          {
            echo "## go-audio-stream ${GITHUB_REF_NAME}"
            echo
            echo "Pure-Go audio stream sources: an RTSP 1.0 client (\`rtsp\`), an HTTP progressive source (\`httpsource\`), an HLS source (\`hlssource\`), and a raw UDP/RTP source (\`udpsource\`), plus RTP/RTCP depacketizers (AAC, MP4A-LATM, Opus, G.711, L16). The library core has zero runtime dependencies."
            echo
            echo "Also ships \`stream-doctor\`, a diagnostic CLI that probes an \`rtsp(s)\` camera or an \`http(s)\` progressive source and reports connectivity, codec support, and packet statistics. See [cmd/stream-doctor/README.md](https://github.com/tphakala/go-audio-stream/blob/${GITHUB_REF_NAME}/cmd/stream-doctor/README.md)."
            echo
            echo "### stream-doctor binaries"
            echo
            echo "Prebuilt static binaries are attached below for linux (amd64, arm64, armv7), windows (amd64), and macos (amd64, arm64). The macOS binaries are signed with an Apple Developer ID and notarized. Verify with \`checksums.txt\`."
            echo
            echo "Codec decoders bundled in stream-doctor: go-aac ${aac}, go-opus ${opus}, go-wav ${wav}."
            echo
          } > "${GITHUB_WORKSPACE}/notes-preamble.md"
          cat "${GITHUB_WORKSPACE}/notes-preamble.md"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        # Draft so the notes and binaries can be reviewed before publishing.
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${GITHUB_WORKSPACE}/notes-preamble.md" \
            --generate-notes \
            "${GITHUB_WORKSPACE}"/dist/*
