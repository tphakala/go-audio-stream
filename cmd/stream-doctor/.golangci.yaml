# Adapted from the repo root .golangci.yaml (itself adapted from
# birdnet-go's) to lint the stream-doctor module on its own. Differences
# from the root config:
#   - no gocritic ruleguard wiring: the doctor module does not depend on
#     the ruleguard DSL, so gocritic runs with its built-in checks only.
version: "2"
output:
  sort-order:
    - linter
    - severity
    - file
linters:
  enable:
    - bodyclose
    - canonicalheader
    - copyloopvar
    - dupl
    - durationcheck
    - errname
    - errorlint
    - exhaustive
    - fatcontext
    - forcetypeassert
    - gocheckcompilerdirectives
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - iface
    - ineffassign
    - makezero
    - misspell
    - modernize
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - perfsprint
    - predeclared
    - prealloc
    - reassign
    - revive
    - staticcheck
    - testifylint
    - thelper
    - unconvert
    - usestdlibvars
    - wastedassign
  disable:
    - unused
  settings:
    gocognit:
      min-complexity: 50
    gocritic:
      disabled-checks:
        - commentFormatting
        - commentedOutCode
      enabled-tags:
        - style
        - diagnostic
        - performance
      settings:
        hugeParam:
          # rtsp.Track is 88 bytes with the FMTP and PayloadType diagnostic fields,
          # and Options reaches 128 bytes once every flag has a field. The doctor
          # passes both by value through cold-path helpers (once per run:
          # decodable, setupDetail, the writeWAV family, Collect, classifyFailure,
          # proberFor), where a copy is free, so the default 80-byte threshold is
          # too aggressive. Kept just above Options so a genuinely huge param is
          # still caught.
          sizeThreshold: 136
    revive:
      rules:
        - name: unused-parameter
          disabled: true
    prealloc:
      simple: true
      range-loops: true
      for-loops: true
    exhaustive:
      default-signifies-exhaustive: true
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: true
  new: false
