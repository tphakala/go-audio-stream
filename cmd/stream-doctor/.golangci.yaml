# Adapted from the repo root .golangci.yaml (itself adapted from
# birdnet-go's) to lint the stream-doctor module on its own. Differences
# from the root config:
#   - no gocritic ruleguard wiring: the doctor module does not depend on
#     the ruleguard DSL, so gocritic runs with its built-in checks only.
version: "2"
output:
  sort-order:
    - linter
    - severity
    - file
linters:
  enable:
    - bodyclose
    - copyloopvar
    - dupl
    - durationcheck
    - errname
    - errorlint
    - exhaustive
    - fatcontext
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - iface
    - ineffassign
    - misspell
    - nilerr
    - nilnil
    - predeclared
    - prealloc
    - revive
    - staticcheck
    - testifylint
    - thelper
    - unconvert
    - wastedassign
  disable:
    - unused
  settings:
    gocognit:
      min-complexity: 50
    gocritic:
      disabled-checks:
        - commentFormatting
        - commentedOutCode
      enabled-tags:
        - style
        - diagnostic
        - performance
      settings:
        hugeParam:
          # rtsp.Track is 80 bytes since it gained the FMTP diagnostic field.
          # The doctor passes it by value through cold-path helpers (once per
          # run: decodable, setupDetail, the writeWAV family, Collect), where a
          # copy is free, so the default 80-byte threshold is too aggressive.
          # Kept active above this so a genuinely huge param is still caught.
          sizeThreshold: 128
    revive:
      rules:
        - name: unused-parameter
          disabled: true
    prealloc:
      simple: true
      range-loops: true
      for-loops: true
    exhaustive:
      default-signifies-exhaustive: true
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: true
  new: false
